name: Bug with a reproduction
description: Something in this repository is wrong. Not a request for help.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Questions are closed unanswered. This form is for a defect in the scripts, modules or
        documentation, with enough detail to act on without asking you anything.
  - type: input
    attributes:
      label: Which file
      placeholder: "scripts/bringup.sh, or docs/TUTORIAL.md Part 7"
    validations: { required: true }
  - type: textarea
    attributes:
      label: What you ran and what happened
      description: Exact command, exact output. Note that bringup/startguest/hardreset are documented as never having been run as a full cycle.
      render: shell
    validations: { required: true }
  - type: textarea
    attributes:
      label: What you expected instead
    validations: { required: true }
  - type: input
    attributes:
      label: Kernel and driver version
      placeholder: "6.1.71-1-lts, 535.309.01"
    validations: { required: true }
