name: check

# Holds the supported scripts at zero shellcheck findings and catches the two
# defect classes that bash -n cannot see: a literal \n where a line
# continuation was meant, and an embedded NUL byte. Both of those have shipped
# in this repository before and both broke real commands.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Syntax, NUL bytes and shellcheck
        run: make check

      - name: Reject literal backslash-n outside comments and strings
        run: |
          # In bash, "cmd \n  || other" is an escaped n, not a line
          # continuation, so "n" is passed as an argument. bash -n accepts it.
          if grep -rnP '[^\]\n\s+\|\|' --include='*.sh' .; then
            echo "found a literal \n where a line continuation was meant"
            exit 1
          fi
          echo "none found"

      - name: Scripts must be executable
        run: |
          # Committing from Windows loses the exec bit, and a clone then gives
          # scripts that fail with "command not found" while every doc says to
          # run them directly. This shipped once already.
          bad=$(git ls-files -s '*.sh' '*.py' | awk '$1=="100644" {print $4}')
          if [ -n "$bad" ]; then
            echo "not executable:"; echo "$bad"; exit 1
          fi
          echo "all scripts executable"

      - name: Reject machine-specific values
        run: |
          # The repository is scrubbed of one machine's details. Keep it that way.
          #
          # \< and \> matter: without them the IP pattern also matches inside longer
          # dotted strings, and a Windows driver version like 31.0.15.3972 is reported
          # as an IP address because 31.0.15.397 is a substring of it.
          pat='\<[0-9]{1,3}(\.[0-9]{1,3}){3}\>|\<[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\>'
          # Allowed: constants that are the same on every machine, the documentation
          # subnet used for the isolated guest bridge, and public resolvers. A real
          # LAN address such as 192.168.1.4 is still rejected.
          allow='0\.0\.0\.0|127\.0\.0\.1|127\.0\.1\.1|10\.10\.10\.[0-9]+|1\.1\.1\.1|8\.8\.8\.8'
          allow="$allow|4d36e968-e325-11ce-bfc1-08002be10318|94\.02\.42\.40|ROOT-FS-UUID"
          if grep -rInE "$pat" --include='*.sh' --include='*.md' --include='*.example' . \
             | grep -vE "$allow"; then
            echo "found an IP address or filesystem UUID that should be a placeholder"
            exit 1
          fi
          echo "none found"

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers
        run: sudo apt-get update -qq && sudo apt-get install -y linux-headers-$(uname -r) build-essential

      - name: Build the required modules and isrfind
        # These are built against the runner's kernel purely to prove they
        # compile. They are useless on any kernel other than the one they were
        # built for - insmod rejects the version magic.
        run: make modules
